name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Types, Tests & Container Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Install Relay Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r relay/requirements.txt pytest

      - name: [1/5] Frontend Type Checks (svelte-check)
        run: npm --prefix frontend run check

      - name: [2/5] Frontend Unit Tests (Vitest)
        run: npm --prefix frontend test

      - name: [3/5] Relay Unit Tests (pytest)
        run: pytest relay/test_relay.py

      - name: [4/5] Build Frontend Production Assets
        run: npm --prefix frontend run build

      - name: [5/5] Test Docker Container Image Builds
        run: |
          docker build -t hwt-frontend:ci ./frontend
          docker build -t hwt-relay:ci ./relay
