name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Types, Tests & Container Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Install Relay Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r relay/requirements.txt pytest

      - name: "[1/5] Frontend Type Checks (svelte-check)"
        run: npm --prefix frontend run check

      - name: "[2/5] Frontend Unit Tests (Vitest)"
        run: npm --prefix frontend test

      - name: "[3/5] Relay Unit Tests (pytest)"
        run: pytest relay/test_relay.py

      - name: "[4/5] Build Frontend Production Assets"
        run: npm --prefix frontend run build

      - name: "[5/5] Test Docker Container Image Builds"
        run: |
          docker build -t hwt-frontend:ci ./frontend
          docker build -t hwt-relay:ci ./relay

  deploy:
    name: Redeploy Stack via Tailscale
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Trigger Dockhand Redeploy
        env:
          WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          PAYLOAD='{"ref":"refs/heads/main"}'
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')
          
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://dockhand.tail.tikap.me/api/git/stacks/1/webhook?secret=$WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -H "X-Gitlab-Token: $WEBHOOK_SECRET" \
            -d "$PAYLOAD")
          
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | sed 's/HTTP_STATUS://')
          
          echo "Response status: $STATUS"
          echo "Response body: $BODY"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Successfully triggered Dockhand redeploy!"
          else
            echo "Error: Webhook returned HTTP status $STATUS"
            if echo "$BODY" | grep -q "not enabled"; then
              echo "Dockhand says the webhook is not enabled for stack 1."
              echo "Please ensure you have saved the stack settings with 'Enable webhook' turned ON in Dockhand."
            fi
            exit 1
          fi
