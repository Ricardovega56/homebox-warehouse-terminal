services:
  # ── Homebox inventory backend ──
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: always
    environment:
      - HBOX_LOG_LEVEL=info
      - HBOX_LOG_FORMAT=text
      - HBOX_WEB_MAX_UPLOAD_SIZE=10
      - HBOX_OPTIONS_ALLOW_ANALYTICS=false
      - HBOX_AUTH_API_KEY_PEPPER=${HBOX_AUTH_API_KEY_PEPPER}
    volumes:
      - homebox-data:/data/
    # No ports exposed — nginx proxies /api/* internally

  # ── PWA frontend + reverse proxy ──
  frontend:
    build: ./frontend
    ports:
      - "3100:80"
    depends_on:
      - homebox
      - relay
    restart: unless-stopped

  # ── Print relay (Homebox labelmaker → CUPS → Brother QL-800) ──
  relay:
    build: ./relay
    environment:
      - HOMEBOX_BASE_URL=http://homebox:7745
      - HOMEBOX_API_TOKEN=${HOMEBOX_API_TOKEN}
      - PRINTER_NAME=${PRINTER_NAME:-Brother_QL_800}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - homebox
    restart: unless-stopped
    # No ports exposed — nginx proxies /relay/* internally

volumes:
  homebox-data:
    driver: local
