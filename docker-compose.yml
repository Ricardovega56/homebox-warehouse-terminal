services:
  # ── Homebox inventory backend ──
  # UI: http://<host>:3101  (admin, API key creation, item management)
  # API: also proxied via nginx at http://<host>:3100/api/*
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: always
    environment:
      - HBOX_LOG_LEVEL=info
      - HBOX_LOG_FORMAT=text
      - HBOX_WEB_MAX_UPLOAD_SIZE=10
      - HBOX_OPTIONS_ALLOW_ANALYTICS=false
      - HBOX_AUTH_API_KEY_PEPPER=${HBOX_AUTH_API_KEY_PEPPER}
    volumes:
      - homebox-data:/data/
    ports:
      - "3101:7745"

  # ── PWA frontend + reverse proxy ──
  frontend:
    build: ./frontend
    ports:
      - "3100:80"
    depends_on:
      - homebox
      - relay
    restart: unless-stopped

  # ── Print relay (Homebox labelmaker → CUPS → Brother QL-800) ──
  relay:
    build: ./relay
    environment:
      - HOMEBOX_BASE_URL=http://homebox:7745
      - HOMEBOX_API_TOKEN=${HOMEBOX_API_TOKEN}
      - PRINTER_NAME=${PRINTER_NAME:-QL-800}
      - PRINTER_MODEL=${PRINTER_MODEL:-QL-800}
      - LABEL_TYPE=${LABEL_TYPE:-62red}
      - CUPS_SERVER=${CUPS_SERVER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/cups/cups.sock:/var/run/cups/cups.sock
    depends_on:
      - homebox
    restart: unless-stopped
    # No ports exposed — nginx proxies /relay/* internally

volumes:
  homebox-data:
    driver: local
